{% extends 'base.html' %}
{# might remove the extend part for modal #}

{% block layout %}
<div class="wrap columns is-centered">

    <form
        method="POST"
        class="column is-4"
    >

        <h4> Create Quest </h4>
        
        {% csrf_token %}
        
        {{form}}
        <button type="submit"> Submit Quest</button>
        <a href="{{  request.META.HTTP_REFERER }}">Cancel</a>

    </form>

</div>

{% endblock %}
