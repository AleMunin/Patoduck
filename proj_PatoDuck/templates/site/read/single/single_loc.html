{# this require the information to be sent as "loc", for a single Location object #}

<div class="print-loc" id="print_loc_{{ loc.id }}">
    <header class="print-loc-header">

        <h6> 
            <a href="{% url 'edit_loc' loc.id %}">  {{ loc.name  }}</a>  
        </h6>
        <ul>
            <li><strong>PT:</strong> {{ loc.name_pt }} </li>
            <li><strong>ES:</strong> {{ loc.name_es }} </li>
        </ul>
    </header>

    {# Add if it is indoors or not #}
    <p> {{ loc.description }} </p>

    <div>Insert Modal Button Here</div>
</div>
