{% extends 'base.html'%}
<!-- The extend to home is temporary, something else when you need -->

{% block layout %}
<div>
 
    {% block content %}

    <h1> Here are all {{ total_char }} the characters in the game</h1>

    <div>
        {% for char in chars %}
        <header> {{ char.name }} </header>

        {% if char.walkable == true %}
            <p> Is walkable </p>
        {% endif %}


        {% endfor %}
    
    </div>

    {% endblock %}
    
</div>

{% endblock %}
